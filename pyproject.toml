[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tendersense"
version = "1.0.0"
description = "Intelligent Procurement Intelligence & Bidding Decision Engine for BracIT"
readme = "README.md"
authors = [{ name = "Model Mavericks", email = "info@bracits.com" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "tabulate>=0.9.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0"
]
ai = [
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "sentence-transformers>=3.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
